name: Database

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations, lint and tenant RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on warning

      - name: Run pgTAP tests
        shell: bash
        run: |
          set +e
          test_output="$(supabase test db 2>&1)"
          test_status=$?
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            annotation="$(
              printf '%s\n' "$test_output" |
                tail -n 80 |
                sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'
            )"
            printf '::error title=pgTAP failure::%s\n' "$annotation"
            exit "$test_status"
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
